<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dede Korkut - Tanıtım Videosu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background: #000;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Video Viewport - Fullscreen */
    #video-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }

    /* Transparent Touch/Click Zone for Play/Pause */
    #tap-zone {
      position: absolute;
      inset: 0;
      z-index: 100;
      cursor: pointer;
    }

    /* Floating Skip / Siteye Dön Button */
    .skip-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10001;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .skip-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .skip-btn:active {
      transform: translateY(0);
    }

    /* Big Center Indicator (Play / Pause Feedback) */
    .center-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.65);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 500;
    }

    .center-indicator.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .center-indicator svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
    }

    /* Subtle Bottom Progress Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.8rem 1.2rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #video-wrapper:hover .bottom-bar,
    .bottom-bar.active {
      opacity: 1;
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 9999px;
      pointer-events: none;
    }

    .time-text {
      font-size: 0.78rem;
      font-weight: 500;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    /* End Video Overlay */
    .end-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      z-index: 10002;
      padding: 1.5rem;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .end-overlay.active {
      display: flex;
    }

    .end-title {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    .end-desc {
      color: #94a3b8;
      font-size: 1.05rem;
      max-width: 360px;
      line-height: 1.5;
    }

    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #fff;
      padding: 0.9rem 2rem;
      border-radius: 9999px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.5);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-action-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.7);
    }

    .btn-action-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    @media (max-width: 768px) {
      .skip-btn {
        top: 1rem;
        right: 1rem;
        padding: 0.5rem 1.15rem;
        font-size: 0.88rem;
      }
      .center-indicator {
        width: 70px;
        height: 70px;
      }
      .center-indicator svg {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Container -->
  <div id="video-wrapper">
    <video id="main-video" src="dedekorkut.mp4" playsinline webkit-playsinline x5-playsinline preload="auto"></video>

    <!-- Tap Zone for Screen Touch Play/Stop -->
    <div id="tap-zone" title="Videoyu Durdurmak / Oynatmak için dokunun"></div>

    <!-- Eski sevilen floating butonu: Dergiyi Aç / E-Dergiye Dön -->
    <a href="index.html" class="skip-btn" id="skip-btn" title="E-Dergiyi Aç">
      <span>Dergiyi Aç</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 4 15 12 5 20 5 4"></polygon>
        <line x1="19" y1="5" x2="19" y2="19"></line>
      </svg>
    </a>

    <!-- Center Indicator (Play / Pause feedback) -->
    <div class="center-indicator" id="center-indicator">
      <svg id="icon-indicator-play" viewBox="0 0 24 24" style="display:none; margin-left: 3px;">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <svg id="icon-indicator-pause" viewBox="0 0 24 24" style="display:none;">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    </div>

    <!-- Subtle Bottom Progress Bar -->
    <div class="bottom-bar" id="bottom-bar">
      <div class="progress-bar" id="progress-container">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="time-text" id="time-display">0:00 / 0:00</span>
    </div>

    <!-- End of Video Action Overlay -->
    <div class="end-overlay" id="end-overlay">
      <h2 class="end-title">Dede Korkut</h2>
      <p class="end-desc">Tanıtım videosu tamamlandı. Şimdi e-dergiyi inceleyebilirsiniz.</p>
      
      <a href="index.html" class="btn-action-primary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>E-Dergiyi Aç ve Oku</span>
      </a>

      <button class="btn-action-secondary" id="btn-replay">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>Videoyu Yeniden Oynat</span>
      </button>
    </div>
  </div>

  <script>
    const video = document.getElementById('main-video');
    const tapZone = document.getElementById('tap-zone');
    const skipBtn = document.getElementById('skip-btn');
    const centerIndicator = document.getElementById('center-indicator');
    const indicatorPlay = document.getElementById('icon-indicator-play');
    const indicatorPause = document.getElementById('icon-indicator-pause');
    const bottomBar = document.getElementById('bottom-bar');
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progress-fill');
    const timeDisplay = document.getElementById('time-display');
    const endOverlay = document.getElementById('end-overlay');
    const btnReplay = document.getElementById('btn-replay');

    let indicatorTimeout = null;
    let barHideTimeout = null;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateTime() {
      const cur = formatTime(video.currentTime);
      const dur = formatTime(video.duration);
      timeDisplay.textContent = `${cur} / ${dur}`;
    }

    function showIndicator(type) {
      indicatorPlay.style.display = (type === 'play') ? 'block' : 'none';
      indicatorPause.style.display = (type === 'pause') ? 'block' : 'none';
      centerIndicator.classList.add('visible');
      clearTimeout(indicatorTimeout);
      indicatorTimeout = setTimeout(() => {
        centerIndicator.classList.remove('visible');
      }, 500);
    }

    function showBottomBar() {
      bottomBar.classList.add('active');
      clearTimeout(barHideTimeout);
      if (!video.paused && !video.ended) {
        barHideTimeout = setTimeout(() => {
          bottomBar.classList.remove('active');
        }, 2800);
      }
    }

    // Toggle Play / Stop
    function togglePlay() {
      showBottomBar();
      if (video.paused || video.ended) {
        endOverlay.classList.remove('active');
        const p = video.play();
        if (p !== undefined) {
          p.then(() => {
            showIndicator('play');
          }).catch(() => {
            video.muted = true;
            video.play().then(() => {
              showIndicator('play');
            });
          });
        }
      } else {
        video.pause();
        showIndicator('pause');
      }
    }

    // Mobile Touch & Tap Handling
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    tapZone.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    tapZone.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      const dx = Math.abs(t.clientX - touchStartX);
      const dy = Math.abs(t.clientY - touchStartY);
      const dt = Date.now() - touchStartTime;
      if (dx < 15 && dy < 15 && dt < 450) {
        e.preventDefault();
        togglePlay();
      }
    });

    tapZone.addEventListener('click', () => {
      if (Date.now() - touchStartTime < 550) return;
      togglePlay();
    });

    // Scrubber
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressFill.style.width = pct + '%';
        updateTime();
      }
    });

    video.addEventListener('loadedmetadata', updateTime);

    progressContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = progressContainer.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (video.duration) video.currentTime = pos * video.duration;
      showBottomBar();
    });

    // When video ends
    video.addEventListener('ended', () => {
      endOverlay.classList.add('active');
    });

    // Replay
    btnReplay.addEventListener('click', (e) => {
      e.stopPropagation();
      endOverlay.classList.remove('active');
      video.currentTime = 0;
      video.play().then(() => {
        showIndicator('play');
        showBottomBar();
      });
    });

    // Spacebar to play/pause
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'k') {
        e.preventDefault();
        togglePlay();
      }
    });

    // Pause video before navigation to index.html
    document.querySelectorAll('a[href="index.html"]').forEach(link => {
      link.addEventListener('click', () => {
        try { video.pause(); } catch (err) {}
      });
    });

    // Auto-play on load
    window.addEventListener('DOMContentLoaded', () => {
      const p = video.play();
      if (p !== undefined) {
        p.catch(() => {
          video.muted = true;
          video.play().catch(() => {});
        });
      }
    });
  </script>
</body>
</html>

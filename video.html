<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dede Korkut - Tanıtım Videosu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background: #030712;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Navigation Header */
    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      z-index: 40;
      flex-shrink: 0;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #fff;
      transform: translateX(-2px);
    }

    .nav-btn-highlight {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #ffffff;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-btn-highlight:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.6);
    }

    .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    /* Video Viewport */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .video-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: calc(100vh - 56px);
      object-fit: contain;
      background: #000;
      pointer-events: none; /* Let taps fall onto the tap-zone */
    }

    /* Transparent Tap Zone directly over video */
    .tap-zone {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
    }

    /* Center Animated Play/Pause Indicator */
    .center-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.65);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 25;
    }

    .center-indicator.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .center-indicator svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
    }

    /* Video Controls Bar */
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.85rem 1.2rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 70%, transparent 100%);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      z-index: 30;
      transition: opacity 0.3s ease;
      opacity: 1;
    }

    .video-controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .control-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      transition: color 0.2s ease, transform 0.15s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    .control-btn:hover {
      color: #38bdf8;
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.08);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }

    .progress-bar-filled {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 9999px;
      pointer-events: none;
      position: relative;
    }

    .progress-bar-filled::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
    }

    .time-display {
      font-size: 0.82rem;
      font-weight: 500;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* End Video Overlay */
    .end-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      z-index: 50;
      padding: 1.5rem;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .end-overlay.active {
      display: flex;
    }

    .end-title {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    .end-desc {
      color: #94a3b8;
      font-size: 1.05rem;
      max-width: 360px;
      line-height: 1.5;
    }

    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #fff;
      padding: 0.9rem 2rem;
      border-radius: 9999px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.5);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-action-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.7);
    }

    .btn-action-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    @media (max-width: 768px) {
      .header-title { display: none; }
      .nav-btn { padding: 0.4rem 0.85rem; font-size: 0.82rem; }
      .nav-btn-highlight { padding: 0.4rem 0.95rem; font-size: 0.82rem; }
      .center-indicator { width: 70px; height: 70px; }
      .center-indicator svg { width: 32px; height: 32px; }
      .video-controls { padding: 0.6rem 0.8rem; gap: 0.55rem; }
      .time-display { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <a href="index.html" class="nav-btn" id="btn-header-back" title="Ana Sayfaya / E-Dergiye Dön">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>E-Dergiye Dön</span>
    </a>

    <span class="header-title">Dede Korkut Tanıtım Videosu</span>

    <a href="index.html" class="nav-btn-highlight" id="btn-header-read" title="Dergiyi Aç">
      <span>Dergiyi Aç 📖</span>
    </a>
  </header>

  <!-- Video Viewport -->
  <main>
    <div class="video-container" id="video-container">
      <video id="main-video" src="dedekorkut.mp4" playsinline webkit-playsinline x5-playsinline preload="auto"></video>

      <!-- Transparent Touch/Click Zone -->
      <div class="tap-zone" id="tap-zone" title="Oynat / Durdur için dokunun"></div>

      <!-- Center Indicator (Play / Pause feedback) -->
      <div class="center-indicator" id="center-indicator">
        <svg id="icon-indicator-play" viewBox="0 0 24 24" style="display:none; margin-left: 3px;">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="icon-indicator-pause" viewBox="0 0 24 24" style="display:none;">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </div>

      <!-- Video Controls Bar -->
      <div class="video-controls" id="video-controls">
        <button class="control-btn" id="btn-play-toggle" title="Oynat / Durdur">
          <svg id="icon-btn-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none; margin-left: 2px;">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="icon-btn-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

        <span class="time-display" id="time-display">0:00 / 0:00</span>

        <div class="progress-bar-container" id="progress-container">
          <div class="progress-bar-filled" id="progress-filled"></div>
        </div>

        <button class="control-btn" id="btn-mute-toggle" title="Sesi Aç / Kapat">
          <svg id="icon-btn-vol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="icon-btn-muted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button class="control-btn" id="btn-fs" title="Tam Ekran">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>

      <!-- End of Video Overlay -->
      <div class="end-overlay" id="end-overlay">
        <h2 class="end-title">Dede Korkut</h2>
        <p class="end-desc">Tanıtım videosu tamamlandı. Şimdi e-dergiyi inceleyebilirsiniz.</p>
        
        <a href="index.html" class="btn-action-primary">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>E-Dergiyi Aç ve Oku</span>
        </a>

        <button class="btn-action-secondary" id="btn-replay">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Videoyu Yeniden Oynat</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById('main-video');
    const videoContainer = document.getElementById('video-container');
    const tapZone = document.getElementById('tap-zone');
    const centerIndicator = document.getElementById('center-indicator');
    const indicatorPlay = document.getElementById('icon-indicator-play');
    const indicatorPause = document.getElementById('icon-indicator-pause');
    const videoControls = document.getElementById('video-controls');
    const btnPlayToggle = document.getElementById('btn-play-toggle');
    const iconBtnPlay = document.getElementById('icon-btn-play');
    const iconBtnPause = document.getElementById('icon-btn-pause');
    const btnMuteToggle = document.getElementById('btn-mute-toggle');
    const iconBtnVol = document.getElementById('icon-btn-vol');
    const iconBtnMuted = document.getElementById('icon-btn-muted');
    const progressContainer = document.getElementById('progress-container');
    const progressFilled = document.getElementById('progress-filled');
    const timeDisplay = document.getElementById('time-display');
    const btnFs = document.getElementById('btn-fs');
    const endOverlay = document.getElementById('end-overlay');
    const btnReplay = document.getElementById('btn-replay');

    let indicatorTimeout = null;
    let controlsHideTimeout = null;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateTimeDisplay() {
      const cur = formatTime(video.currentTime);
      const dur = formatTime(video.duration);
      timeDisplay.textContent = `${cur} / ${dur}`;
    }

    function showIndicator(type) {
      // type: 'play' or 'pause'
      indicatorPlay.style.display = (type === 'play') ? 'block' : 'none';
      indicatorPause.style.display = (type === 'pause') ? 'block' : 'none';
      centerIndicator.classList.add('visible');
      clearTimeout(indicatorTimeout);
      indicatorTimeout = setTimeout(() => {
        centerIndicator.classList.remove('visible');
      }, 550);
    }

    function updatePlayIcons(isPaused) {
      iconBtnPlay.style.display = isPaused ? 'block' : 'none';
      iconBtnPause.style.display = isPaused ? 'none' : 'block';
    }

    function scheduleControlsHide() {
      clearTimeout(controlsHideTimeout);
      videoControls.classList.remove('hidden');
      if (!video.paused && !video.ended) {
        controlsHideTimeout = setTimeout(() => {
          videoControls.classList.add('hidden');
        }, 3200);
      }
    }

    // Toggle Play / Pause
    function togglePlay() {
      scheduleControlsHide();
      if (video.paused || video.ended) {
        endOverlay.classList.remove('active');
        const p = video.play();
        if (p !== undefined) {
          p.then(() => {
            updatePlayIcons(false);
            showIndicator('play');
          }).catch(() => {
            // If browser blocks audio, start muted
            video.muted = true;
            iconBtnVol.style.display = 'none';
            iconBtnMuted.style.display = 'block';
            video.play().then(() => {
              updatePlayIcons(false);
              showIndicator('play');
            });
          });
        }
      } else {
        video.pause();
        updatePlayIcons(true);
        showIndicator('pause');
      }
    }

    // Touch & Click handling for tap-zone
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    tapZone.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    tapZone.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      const dx = Math.abs(t.clientX - touchStartX);
      const dy = Math.abs(t.clientY - touchStartY);
      const dt = Date.now() - touchStartTime;
      // Quick tap without significant movement
      if (dx < 15 && dy < 15 && dt < 450) {
        e.preventDefault();
        togglePlay();
      }
    });

    tapZone.addEventListener('click', () => {
      // Avoid synthetic ghost click after touchend
      if (Date.now() - touchStartTime < 550) return;
      togglePlay();
    });

    btnPlayToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    // Mute toggle
    btnMuteToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      scheduleControlsHide();
      video.muted = !video.muted;
      iconBtnVol.style.display = video.muted ? 'none' : 'block';
      iconBtnMuted.style.display = video.muted ? 'block' : 'none';
    });

    // Scrubber Progress bar
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressFilled.style.width = pct + '%';
        updateTimeDisplay();
      }
    });

    video.addEventListener('loadedmetadata', () => {
      updateTimeDisplay();
    });

    function seekToPosition(clientX) {
      const rect = progressContainer.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      if (video.duration) {
        video.currentTime = pos * video.duration;
      }
    }

    let isSeeking = false;
    progressContainer.addEventListener('mousedown', (e) => {
      isSeeking = true;
      seekToPosition(e.clientX);
    });
    window.addEventListener('mousemove', (e) => {
      if (isSeeking) seekToPosition(e.clientX);
    });
    window.addEventListener('mouseup', () => {
      isSeeking = false;
    });

    // Touch scrubbing
    progressContainer.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      isSeeking = true;
      seekToPosition(e.touches[0].clientX);
    }, { passive: false });
    progressContainer.addEventListener('touchmove', (e) => {
      e.stopPropagation();
      if (isSeeking) seekToPosition(e.touches[0].clientX);
    }, { passive: false });
    progressContainer.addEventListener('touchend', (e) => {
      e.stopPropagation();
      isSeeking = false;
    });

    // When video ends
    video.addEventListener('ended', () => {
      updatePlayIcons(true);
      videoControls.classList.remove('hidden');
      endOverlay.classList.add('active');
    });

    // Replay button
    btnReplay.addEventListener('click', (e) => {
      e.stopPropagation();
      endOverlay.classList.remove('active');
      video.currentTime = 0;
      video.play().then(() => {
        updatePlayIcons(false);
        scheduleControlsHide();
      });
    });

    // Fullscreen toggle
    btnFs.addEventListener('click', (e) => {
      e.stopPropagation();
      scheduleControlsHide();
      if (!document.fullscreenElement) {
        if (videoContainer.requestFullscreen) {
          videoContainer.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'k') {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'm' || e.key === 'M') {
        btnMuteToggle.click();
      } else if (e.key === 'f' || e.key === 'F') {
        btnFs.click();
      }
    });

    // Mouse movement reveals controls
    videoContainer.addEventListener('mousemove', () => {
      scheduleControlsHide();
    });

    // Pause video when navigating to dergi
    document.querySelectorAll('a[href="index.html"]').forEach(link => {
      link.addEventListener('click', () => {
        try { video.pause(); } catch (err) {}
      });
    });

    // Autoplay attempt on load
    window.addEventListener('DOMContentLoaded', () => {
      const p = video.play();
      if (p !== undefined) {
        p.then(() => {
          updatePlayIcons(false);
          scheduleControlsHide();
        }).catch(() => {
          // Autoplay was blocked with sound: play muted
          video.muted = true;
          iconBtnVol.style.display = 'none';
          iconBtnMuted.style.display = 'block';
          video.play().then(() => {
            updatePlayIcons(false);
            scheduleControlsHide();
          }).catch(() => {
            updatePlayIcons(true);
          });
        });
      }
    });
  </script>
</body>
</html>
